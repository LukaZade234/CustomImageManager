# DigitalOcean App Platform configuration
# Deploy: Connect this repo at cloud.digitalocean.com/apps
#
# If the app was previously static, update the spec in the dashboard:
# Settings → App Spec → Replace with this YAML → Save
name: imgmanager

services:
  - name: web
    # React SPA: Dockerfile builds frontend + runs Flask
    dockerfile_path: Dockerfile
    http_port: 8080
    envs:
      - key: IMGCHEST_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Add DATABASE_URL here if using PostgreSQL (type: SECRET)
