# DigitalOcean App Platform configuration
# Deploy: Connect this repo at cloud.digitalocean.com/apps
#
# If the app was previously static, update the spec in the dashboard:
# Settings → App Spec → Replace with this YAML → Save
name: imgmanager

services:
  - name: web
    run_command: gunicorn --worker-tmp-dir /dev/shm --timeout 120 --bind 0.0.0.0:$PORT app:app
    environment_slug: python
    http_port: 8080
